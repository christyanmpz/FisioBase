{% extends "base.html" %}

{% block title %}Novo usuário · FisioBase{% endblock %}
{% block body_class %}app-page{% endblock %}

{% block body %}
    <header class="topbar">
      <div>
        <p class="breadcrumb">Profissionais <span>/</span> Novo</p>
        <h1>Novo usuário</h1>
      </div>
    </header>

    <form method="post" class="form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="field">
        <label for="nome">Nome completo</label>
        <input id="nome" name="nome" type="text" required autofocus>
      </div>

      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required autocomplete="off">
      </div>

      <div class="field">
        <label for="senha">Senha inicial</label>
        <input id="senha" name="senha" type="password" required minlength="8"
               autocomplete="new-password">
        <small>Mínimo de 8 caracteres. Informe a senha ao profissional.</small>
      </div>

      <div class="field">
        <label for="perfil">Perfil</label>
        <select id="perfil" name="perfil" required>
          <option value="FISIOTERAPEUTA">Fisioterapeuta</option>
          <option value="ADMIN">Administrador</option>
        </select>
      </div>

      <div class="form-actions">
        <button class="button button--primary" type="submit">Criar usuário</button>
        <a class="button button--ghost" href="{{ url_for('listar_usuarios') }}">Cancelar</a>
      </div>
    </form>
{% endblock %}
