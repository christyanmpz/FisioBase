kind = "api"
previewPath = "/"
title = "FisioBase"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 5000
name = "FisioBase"
paths = ["/"]

[services.development]
run = "python ../../app.py"

[services.production]

[services.production.build]
args = ["python", "-m", "compileall", "app.py", "models.py"]

[services.production.run]
args = ["gunicorn", "--chdir", "../..", "--bind", "0.0.0.0:5000", "app:app"]

[services.production.run.env]
PORT = "5000"

[services.production.health.startup]
path = "/login"
